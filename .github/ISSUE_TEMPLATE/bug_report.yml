name: Bug report
description: Report a reproducible framework, schema, classifier, or metric defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: RetreatBench revision
      placeholder: commit SHA or release
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest command, fixture, and error output that reproduce the problem. Remove credentials and private benchmark data.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Benchmark impact
      description: Does this affect task fidelity, evidence tiers, metric denominators, leakage, or published conclusions?
