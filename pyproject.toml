[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retreatbench"
version = "0.1.0"
description = "Harbor-native evaluation of recoverable goal retreat in autonomous agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Jack Wu" }
]
keywords = [
  "agents",
  "benchmark",
  "harbor",
  "trajectory-evaluation",
  "goal-fidelity",
  "agent-safety",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "huggingface_hub>=0.24,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
retreatbench = "retreatbench.cli:app"

[project.entry-points."harbor.plugins"]
avoidance-local = "retreatbench.harbor_plugins:AvoidanceLocal"
avoidance-export-performer = "retreatbench.harbor_plugins:AvoidanceExportPerformer"
avoidance-export-both = "retreatbench.harbor_plugins:AvoidanceExportBoth"

[project.urls]
Homepage = "https://github.com/a-green-hand-jack/RetreatBench"
Repository = "https://github.com/a-green-hand-jack/RetreatBench"
Issues = "https://github.com/a-green-hand-jack/RetreatBench/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retreatbench = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["retreatbench"]
omit = ["src/retreatbench/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
